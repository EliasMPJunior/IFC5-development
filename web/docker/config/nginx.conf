server {
    listen       80;
    server_name  localhost;

    # Habilita compressão gzip para arquivos de texto
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text_xml application/xml application/xml+rss text/javascript;

    location ~* \.mjs$ {
        root   /usr/share/nginx/html;
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Tenta servir o arquivo, se não existir tenta como diretório, senão 404
        try_files $uri $uri/ =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
